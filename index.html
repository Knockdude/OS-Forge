function h(tag,attrs,...kids){
  const e=document.createElement(tag),late={};
  for(const k in (attrs||{})){const v=attrs[k];
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;
    else if(k==='value'||k==='checked')late[k]=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);}
  kids.flat(9).forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)))});
  for(const k in late)e[k]=late[k];
  return e;
}

function reloadPreviewNow(){clearTimeout(t1);try{localStorage.setItem(LS,JSON.stringify(P))}catch(e){}if(frame.contentWindow&&frame.srcdoc){frame.contentWindow.postMessage({__studio:'launch',id:lastLaunch},'*');reloadPreview()}else reloadPreview()}

function tabFiles(b){
  b.append(h('div',{class:'hint'},'Archivos que vendrán dentro del sistema de archivos virtual de tu OS. En el preview se vuelven a copiar en cada recarga; en el OS exportado solo se crean si no existen (así no pisan los cambios del usuario).'));
  P.files.forEach((f,i)=>{
    const ta=h('textarea',{class:'in',rows:5,spellcheck:'false',value:f.content,oninput:e=>{f.content=e.target.value;update()}});tabKey(ta);
    b.append(h('div',{class:'frow'},
      h('div',{class:'row',style:'margin:0 0 6px'},h('input',{class:'in',style:'flex:1',value:f.path,placeholder:'/home/user/archivo.txt',oninput:e=>{f.path=e.target.value;update()}}),h('button',{class:'btn sm dng',onclick:()=>{P.files.splice(i,1);update();renderBody()}},'🗑')),ta));
  });
  b.append(h('button',{class:'btn',onclick:()=>{P.files.push({path:'/home/user/nuevo.txt',content:''});update();renderBody()}},'＋ Añadir archivo'));
}

function tabKernel(b){
  const ta=h('textarea',{class:'in',rows:16,spellcheck:'false',value:P.kernel,oninput:e=>{P.kernel=e.target.value;update()}});tabKey(ta);
  b.append(
    sec('Script del kernel',
      h('div',{class:'hint'},'JavaScript que se ejecuta al arrancar tu OS. Aquí defines comandos, apps, eventos y comportamiento del sistema.'),
      ta,
      h('div',{class:'row'},...SNIPPETS.map(([l,c])=>h('button',{class:'btn sm',onclick:()=>{ta.value+=c;P.kernel=ta.value;update()}},l)))),
    sec('Guía de la API',h('pre',{class:'doc'},KERNEL_DOC))
  );
}

function tabTpl(b){
  b.append(sec('Temas listos',h('div',{class:'grid3'},...PRESETS.map(p=>h('div',{class:'card',onclick:()=>{Object.assign(P,p.c);update();renderBody()}},h('b',{},p.n),h('div',{class:'sw'},...[p.c.bg,p.c.surface,p.c.accent,p.c.accent2].map(c=>h('i',{style:'background:'+c})))))),
    h('div',{class:'hint'},'Aplicar un tema cambia colores, fondo, estilo de ventanas y barra de tareas; no toca tus apps.')));
  b.append(sec('Añadir app desde plantilla',h('div',{class:'grid3'},...Object.keys(APP_TPL).map(k=>h('div',{class:'card',onclick:()=>{const a=tplApp(k);a.id=uniqueId(a.id);P.apps.push(a);curApp=P.apps.length-1;update();tab='apps';renderTabs();renderBody()}},h('b',{},APP_TPL[k].icon+' '+APP_TPL[k].name),h('span',{class:'hint'},'Añadir'))))));
  b.append(sec('Proyecto',h('div',{class:'row'},
    h('button',{class:'btn dng',onclick:()=>{if(confirm('¿Reiniciar el proyecto? Se perderán los cambios no exportados.')){P=defaultProject();curApp=0;update();renderBody()}}},'Restablecer proyecto'),
    h('button',{class:'btn',onclick:()=>{P=Object.assign(defaultProject(),{apps:[],autostart:[],files:[],kernel:'// Tu kernel vacío\n',name:'OSVacio'});curApp=0;update();renderBody()}},'Empezar desde cero (sin apps)'))));
}

$('#bNew').onclick=()=>{if(confirm('¿Crear un proyecto nuevo? Se perderán los cambios no exportados.')){P=defaultProject();curApp=0;update();renderTabs();renderBody()}};
$('#bSave').onclick=()=>download(slugOf(P.name)+'.osforge.json',JSON.stringify(P,null,2),'application/json');
$('#bOpen').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{P=migrate(JSON.parse(r.result));curApp=0;update();renderTabs();renderBody()}catch(x){alert('Proyecto inválido: '+x.message)}};r.readAsText(f);e.target.value=''};
$('#bExport').onclick=()=>download(slugOf(P.name)+'.html',buildOS(P,{preview:false}),'text/html');
$('#bTab').onclick=()=>{const u=URL.createObjectURL(new Blob([buildOS(P,{preview:false})],{type:'text/html'}));window.open(u,'_blank')};
$('#pReload').onclick=reloadPreview;
$('#fast').onchange=reloadPreview;
$('#pWipe').onclick=()=>{const pre='osforge_'+slugOf(P.name)+'_';try{Object.keys(localStorage).filter(k=>k.startsWith(pre)).forEach(k=>localStorage.removeItem(k))}catch(e){}reloadPreview()};
document.querySelectorAll('[data-vp]').forEach(btn=>btn.onclick=()=>{const [w,hh]=btn.dataset.vp.split('x').map(s=>s.trim());frame.style.width=w;frame.style.height=hh});
const conlog=$('#conlog');
function conAdd(l,m){const d=h('div',{class:'l-'+l},'['+new Date().toLocaleTimeString()+'] '+m);conlog.append(d);while(conlog.children.length>200)conlog.firstChild.remove();conlog.scrollTop=conlog.scrollHeight}
$('#conClear').onclick=()=>conlog.replaceChildren();
addEventListener('message',e=>{const d=e.data;if(d&&d.__oslog&&e.source===frame.contentWindow)conAdd(d.lvl==='error'?'error':'info',d.msg)});
(function(){const rz=$('#rz'),side=$('#side');rz.addEventListener('pointerdown',e=>{rz.setPointerCapture(e.pointerId);const mv=ev=>{side.style.width=Math.max(320,ev.clientX)+'px'};const up=()=>{rz.removeEventListener('pointermove',mv);rz.removeEventListener('pointerup',up)};rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',up)})})();

renderTabs();renderBody();reloadPreview();
</script>
</body>
</html>
